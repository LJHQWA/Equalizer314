name: Build Debug APK
on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-24.04 # 显式指定系统，避免未来 ubuntu-latest 迁移影响
    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # 升级至支持 Node 24 的版本

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # v4 已废弃，v6 适配 Node 24 且默认支持 Gradle 缓存
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4 # 升级至 v4 适配 Node 24
        with:
          packages: 'platform-tools' # 必须显式指定！跳过已下架的 legacy 'tools' 包，防止构建中断
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5 # 同样升级至支持 Node 24 的版本
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
